name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests/conftest.py sets these too; kept here so nothing in CI calls a real model.
  AGENTLINE_TRIAGE: "off"
  AGENTLINE_REVIEW: "off"
  AGENTLINE_ADVISOR: "off"

jobs:
  python:
    name: Python (ruff + pytest, fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra server
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pytest (not slow)
        run: uv run pytest -m "not slow"

  web:
    name: Web (vitest + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
